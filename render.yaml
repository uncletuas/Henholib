services:
  - type: web
    name: loopital-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: loopital-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loopital-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: loopital-db
    databaseName: loopital
    user: loopital
